# Use from the same directory as docker-compose.yml to preserve the Compose project.
services:
  impedance-analyzer:
    image: ghcr.io/arannar/impedance-analyzer-4294a:${IMAGE_TAG:-lab}
    container_name: impedance-analyzer
    restart: unless-stopped
    environment:
      DEFAULT_INSTRUMENT_IP: ${DEFAULT_INSTRUMENT_IP:-10.59.133.242}
      HOST: 0.0.0.0
      PORT: 8080
      ROOT_PATH: ${ROOT_PATH:-/impedance-analyzer}
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s
